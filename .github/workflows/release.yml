name: Build Multi-Platform Fn-Edition

on:
  workflow_dispatch: # Permite que você clique num botão no GitHub para buildar quando quiser

jobs:
  build:
    name: Build para ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            name: Termux-Android
            artifact_name: nu-fn-termux
          - target: aarch64-unknown-linux-gnu
            name: Linux-ARM64-VM
            artifact_name: nu-fn-linux-arm64
          - target: x86_64-unknown-linux-gnu
            name: Linux-x86_64-PC
            artifact_name: nu-fn-linux-x64

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Target no Rust
      run: |
        echo "targets = ['${{ matrix.target }}']" >> rust-toolchain.toml

    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1.12.0
      with:
        cache: true # O cache do Cargo vai trabalhar de forma isolada para cada plataforma da matriz

    - name: Instalar Compilador Cross (Apenas para VM ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Setup Android NDK (Apenas para Termux)
      if: matrix.target == 'aarch64-linux-android'
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Injetar OpenSSL Estático (Vendored) no Manifesto
      run: |
        # Isso garante o OpenSSL compilado direto do código-fonte para todas as plataformas, evitando quebra de libs dinâmicas
        cargo add openssl --features vendored
        
    - name: Converter nu-std de 'def' para 'fn'
      run: |
        find crates/nu-std/ -type f -name "*.nu" -exec sed -i 's/\bdef\b/fn/g' {} +

    # --- FLUXO DE COMPILAÇÃO 1: ANDROID/TERMUX ---
    - name: Compilar o Nushell para Termux
      if: matrix.target == 'aarch64-linux-android'
      run: |
        TOOLCHAIN_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
        export PATH=$TOOLCHAIN_BIN:$PATH
        
        ln -sf $TOOLCHAIN_BIN/aarch64-linux-android24-clang $TOOLCHAIN_BIN/aarch64-linux-android-clang
        ln -sf $TOOLCHAIN_BIN/aarch64-linux-android24-clang++ $TOOLCHAIN_BIN/aarch64-linux-android-clang++
        
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android-clang
        export CC_aarch64_linux_android=aarch64-linux-android-clang
        export CXX_aarch64_linux_android=aarch64-linux-android-clang++
        export AR_aarch64_linux_android=llvm-ar
        export RANLIB_aarch64_linux_android=llvm-ranlib
        export CC=aarch64-linux-android-clang
        export CXX=aarch64-linux-android-clang++
        export AR=llvm-ar
        export RANLIB=llvm-ranlib
        
        cat <<EOF > dummy_bionic.c
        void setpwent(void) {}
        void endpwent(void) {}
        void* getpwent(void) { return 0; }
        void setgrent(void) {}
        void endgrent(void) {}
        void* getgrent(void) { return 0; }
        EOF
        
        aarch64-linux-android-clang -c dummy_bionic.c -o dummy_bionic.o
        export RUSTFLAGS="-C link-arg=$(pwd)/dummy_bionic.o"
        
        cargo build --release --target aarch64-linux-android --workspace

    # --- FLUXO DE COMPILAÇÃO 2: LINUX ARM64 (VM) ---
    - name: Compilar o Nushell para Linux ARM64
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
        export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
        
        cargo build --release --target aarch64-unknown-linux-gnu --workspace

    # --- FLUXO DE COMPILAÇÃO 3: LINUX x86_64 (PC) ---
    - name: Compilar o Nushell para Linux x86_64
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        cargo build --release --target x86_64-unknown-linux-gnu --workspace
        
    # --- ARTIFACT UPLOAD GLOBAL ---
    - name: Fazer Upload do Binário
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: target/${{ matrix.target }}/release/nu
