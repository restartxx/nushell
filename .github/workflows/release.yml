name: Build Termux Fn-Edition

on:
  workflow_dispatch: # Permite que você clique num botão no GitHub para buildar quando quiser

jobs:
  build-termux:
    name: Build para Android (Termux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Target no Rust
      run: |
        echo "targets = ['aarch64-linux-android']" >> rust-toolchain.toml

    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1.12.0
      with:
        cache: true # Ativa o cache para os próximos builds irem voando

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b # Versão estável do NDK com suporte ao LLVM/Clang

    - name: Injetar OpenSSL Estático (Vendored) no Manifesto
      run: |
        # Isso força o Cargo a unificar a dependência e baixar o código-fonte C do OpenSSL
        cargo add openssl --features vendored

    - name: Compilar o Nushell Customizado
      run: |
        # 1. Caminhos base do Android NDK
        TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        
        # 2. Compiladores C/C++ corretos do NDK (API 24 do Android/Termux)
        export CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang
        export CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
        export CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang
        export CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
        
        # 3. Linker e Arquivador para o Cargo e Crates -sys
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang
        export AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar
        export AR=$TOOLCHAIN/bin/llvm-ar
        
        # 4. A trava de segurança: Impedir que ele tente procurar no Ubuntu hospedeiro
        export OPENSSL_NO_PKG_CONFIG=1
        
        # 5. O build final
        cargo build --release --target aarch64-linux-android --workspace
        
    - name: Fazer Upload do Binário
      uses: actions/upload-artifact@v4
      with:
        name: nu-fn-termux
        path: target/aarch64-linux-android/release/nu
